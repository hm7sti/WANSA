<!doctype html><html lang="ar" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#031510"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="wansa-icon-192.png"><link rel="apple-touch-icon" href="wansa-apple-180.png"><title>ونسة | WANSA</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"><style>
:root{--sun:url(bg-sunset-v8.jpg)}
:root{
/* ونسة — dark green shell, gold ring on the centre tab, sunset photo as the hero material */
--bg0:#031510;--bg1:#06251c;--panel:#0c2d23;--panel2:#12402f;--line:rgba(80,230,160,.14);
--green:#22c55e;--green2:#15803d;--gold:#f2a21c;--text:#eefaf3;--mute:#8db8a3;--red:#ff4d5a;
--in:#0f2b21;--out:#16803f;--field:#0a2219;--shade:rgba(2,12,8,.72);
--font:'Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;color-scheme:dark}
.light{--bg0:#e8f4ec;--bg1:#f4faf6;--panel:#ffffff;--panel2:#dcefe3;--line:rgba(20,90,55,.16);--text:#12382a;--mute:#4f7766;--in:#ffffff;--field:#ffffff;--shade:rgba(255,255,255,.7);color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#010a07;color:var(--text);font-family:var(--font);-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea{outline:0;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
svg.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.l{text-align:left;unicode-bidi:plaintext}
#app{position:relative;margin:0 auto;width:100%;height:100dvh;max-width:480px;background:var(--bg0);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:600px){body{display:grid;place-items:center}#app{height:min(100dvh - 24px,880px);border-radius:38px;border:2px solid #1b3a2b;box-shadow:0 30px 80px #000c,0 0 50px rgba(34,197,94,.12)}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 55% at 50% 0%,var(--bg1),var(--bg0) 65%);padding-top:env(safe-area-inset-top,0px)}
.scr.full{background:#000;padding-top:0}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}.body::-webkit-scrollbar{display:none}
.hdr{display:flex;align-items:center;gap:6px;padding:10px 10px 8px;flex:none;min-height:54px}
.hdr h1{margin:0;flex:1;text-align:center;font-size:19px;font-weight:800}
.hdr .sp{flex:1}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none;position:relative}
.ib:active{background:var(--panel2)}
.live-t{display:flex;align-items:center;gap:6px;justify-content:center;flex:1;font-size:20px;font-weight:800}.live-t .ic{color:var(--red)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);vertical-align:middle;margin-inline:3px}
.av{display:block;border-radius:50%;overflow:hidden;flex:none;background:var(--panel2)}.av svg{display:block;width:100%;height:100%}
.on-dot{position:relative}.on-dot::after{content:"";position:absolute;right:0;bottom:1px;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid var(--bg0)}
/* nav */
.nav{flex:none;margin:6px 10px calc(10px + env(safe-area-inset-bottom,0px));height:64px;border-radius:26px;border:1.5px solid rgba(242,162,28,.6);background:linear-gradient(#0a2219,#05140e);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:relative;box-shadow:0 0 22px rgba(242,162,28,.22),inset 0 0 16px rgba(242,162,28,.08)}
.light .nav{background:linear-gradient(#fff,#e9f5ee)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:10.5px;font-weight:500;color:var(--mute);position:relative;height:100%;justify-content:flex-end}
.nav button.on{color:var(--green);font-weight:700}.nav button.lv{color:#ff6470}
.nav .bd{position:absolute;top:5px;left:calc(50% + 4px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.nav .mid .ring{position:absolute;top:-24px;left:50%;width:62px;height:62px;margin-left:-31px;border-radius:50%;padding:3px;background:conic-gradient(#ffd56b,#f2891c,#ffd56b);box-shadow:0 0 22px rgba(242,162,28,.65)}
.ring i{display:block;width:100%;height:100%;border-radius:50%;border:2px solid #0a2219;background:var(--sun) 52% 36%/230% auto}
.nav .mid.on .ring{box-shadow:0 0 26px rgba(242,162,28,.95)}
/* controls */
.search{display:flex;align-items:center;gap:10px;margin:2px 14px 12px;height:46px;padding:0 16px;border-radius:24px;background:var(--field);border:1px solid var(--line);color:var(--mute);font-size:15px;width:calc(100% - 28px);text-align:left}
.search input{flex:1;min-width:0;color:var(--text);font-size:15px;text-align:start}
.seg{display:flex;gap:8px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:8px 18px;border-radius:20px;background:var(--panel);border:1px solid var(--line);color:var(--mute);font-weight:700;font-size:13.5px}
.seg.fill button{flex:1}
.seg button.on{background:var(--green);color:#04170d;border-color:var(--green)}
.stories{display:flex;gap:12px;padding:2px 14px 12px;overflow-x:auto;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:5px;width:64px;flex:none;font-size:12px}
.st .rg{width:62px;height:62px;border-radius:50%;padding:2.5px;background:conic-gradient(#ffd56b,#f2891c,#e5a53a,#ffd56b)}
.st .rg .av{border:2.5px solid var(--bg0);width:100%;height:100%}
.st .add{width:62px;height:62px;border-radius:50%;border:2px solid var(--green);display:grid;place-items:center;color:var(--green);background:var(--panel)}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:active{background:var(--panel)}
.row .mid{flex:1;min-width:0}
.nm{font-weight:800;font-size:15.5px;display:block}
.pv{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv .ic{width:15px;height:15px}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:11.5px;color:var(--mute)}
.cnt{min-width:21px;height:21px;border-radius:11px;background:var(--green);color:#04170d;font-weight:800;font-size:11.5px;display:grid;place-items:center;padding:0 6px}
.green{color:var(--green)}.red{color:var(--red)}.mute{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:60px 24px}
/* chat */
.msgs{flex:1;min-height:0;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:9px;scrollbar-width:none;background:radial-gradient(90% 40% at 50% 0%,rgba(34,197,94,.07),transparent)}
.msgs::-webkit-scrollbar{display:none}
.b{max-width:80%;padding:8px 12px 6px;border-radius:15px;font-size:15.5px;line-height:1.5;position:relative;unicode-bidi:plaintext;word-break:break-word}
.b.in{align-self:flex-start;background:var(--in);border:1px solid var(--line);border-bottom-left-radius:4px}
.b.out{align-self:flex-end;background:linear-gradient(180deg,#1a9a4d,#13763b);color:#fff;border-bottom-right-radius:4px}
.b .tm{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:10.5px;opacity:.7;margin-top:2px;direction:ltr;unicode-bidi:isolate}
.b .tm .ic{width:14px;height:14px}
.b .who{font-size:12.5px;font-weight:800;color:#5de3a0;display:block;margin-bottom:2px}
.b.img{padding:4px 4px 3px}.b.img .ph{width:230px;max-width:100%;aspect-ratio:1.6;border-radius:12px;background-size:cover;background-position:center}
.b.img .tm{position:absolute;right:10px;bottom:8px;background:#0007;border-radius:8px;padding:1px 6px;opacity:1;color:#fff;margin:0}
.rx{display:inline-flex;gap:6px;margin-top:5px;font-size:12px;background:#0006;border-radius:12px;padding:2px 8px}
.vc{display:flex;align-items:center;gap:10px;min-width:210px}
.vc .pl{width:38px;height:38px;border-radius:50%;background:var(--green);color:#04170d;display:grid;place-items:center;flex:none}
.vc .pl .ic{fill:currentColor;width:18px;height:18px}
.wv{display:flex;align-items:center;gap:2px;height:28px;flex:1}.wv i{display:block;width:2.5px;border-radius:2px;background:currentColor;opacity:.4}.wv i.f{opacity:1}
.bar{flex:none;display:flex;align-items:center;gap:8px;margin:6px 12px calc(12px + env(safe-area-inset-bottom,0px));padding:5px 6px 5px 14px;border-radius:28px;background:var(--field);border:1.5px solid rgba(34,197,94,.55)}
.bar input{flex:1;min-width:0;font-size:15.5px;height:40px;text-align:start}.bar .ic{color:var(--mute)}
.mic{width:44px;height:44px;border-radius:50%;background:linear-gradient(#2bd368,#14873f);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 14px rgba(34,197,94,.4)}.mic .ic{color:#fff}
.date{align-self:center;font-size:11.5px;color:var(--mute);background:var(--panel);padding:3px 12px;border-radius:12px}
/* cards */
.photo{background:var(--sun) center/cover}
.cards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 13% 14px;scrollbar-width:none}.cards::-webkit-scrollbar{display:none}
.sc{flex:none;width:100%;max-width:290px;height:min(54vh,430px);border-radius:24px;overflow:hidden;position:relative;scroll-snap-align:center;border:1.5px solid rgba(34,197,94,.55);text-align:left}
.sc .bgp{position:absolute;inset:0;background-size:cover}
.sc .sh{position:absolute;inset:0;background:linear-gradient(#0006,transparent 28%,transparent 55%,#000b)}
.prog{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:4px;z-index:2}.prog i{flex:1;height:3px;border-radius:2px;background:#fff5;overflow:hidden}.prog i.d::after,.prog i.a::after{content:"";display:block;height:100%;background:#fff}.prog i.a::after{width:0;animation:fill 6s linear forwards}
@keyframes fill{to{width:100%}}
.sc .top{position:absolute;top:22px;left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:2;color:#fff}
.sc .top b{display:block;font-size:15px}.sc .top small{opacity:.8;font-size:12px}
.sc .bot{position:absolute;left:14px;right:14px;bottom:12px;color:#fff;z-index:2}
.sc .cap{font-size:17px;font-weight:800;text-shadow:0 2px 8px #000;margin-bottom:10px;unicode-bidi:plaintext}
.sc .acts{display:flex;align-items:center;gap:14px;font-size:13px}.sc .acts .gap{flex:1}
.live-card{display:block;margin:0 14px 12px;border-radius:18px;overflow:hidden;position:relative;height:122px;border:1px solid var(--line);width:calc(100% - 28px);text-align:left}
.live-card .th{position:absolute;inset:0}.live-card .th svg{width:100%;height:100%;display:block}
.live-card .sh{position:absolute;inset:0;background:linear-gradient(#0000 25%,#000c)}
.tg{position:absolute;top:9px;left:9px;display:flex;gap:6px;z-index:2}
.tg b{background:#e11d48;color:#fff;font-size:11px;padding:2px 8px;border-radius:7px;letter-spacing:.04em}.tg span{background:#0009;color:#fff;font-size:11.5px;padding:2px 8px;border-radius:7px;display:flex;align-items:center;gap:4px}
.live-card .info{position:absolute;left:12px;right:12px;bottom:9px;display:flex;align-items:center;gap:9px;color:#fff;z-index:2}
.live-card .info b{font-size:15px;display:block}.live-card .info small{opacity:.8;font-size:12px}
.live-card .mo{position:absolute;top:6px;right:6px;color:#fff;z-index:2}
.comm{display:flex;align-items:center;gap:13px;margin:0 14px 10px;padding:8px;border-radius:16px;background:var(--panel);border:1px solid var(--line);width:calc(100% - 28px);text-align:left}
.comm .th{width:78px;height:62px;border-radius:12px;overflow:hidden;flex:none}.comm .th svg{width:100%;height:100%;display:block}
.comm .mid{flex:1;min-width:0}.comm .ic{color:var(--mute)}
.fab{position:absolute;right:18px;bottom:96px;width:58px;height:58px;border-radius:50%;background:linear-gradient(#2bd368,#14873f);display:grid;place-items:center;color:#fff;box-shadow:0 8px 22px rgba(34,197,94,.5);z-index:4}
.fab .ic{width:26px;height:26px}
/* photo screens */
.bgph{position:absolute;inset:0;background:var(--sun) center top/cover}
.login .bgph{background-size:cover;background-position:50% 0}
.login .shade{position:absolute;inset:0;background:linear-gradient(#0000 34%,rgba(3,21,16,.85) 62%,#031510 82%)}
.lg{position:absolute;left:0;right:0;top:calc(7% + env(safe-area-inset-top,0px));display:flex;justify-content:center}.lg img{height:min(32dvh,250px);filter:drop-shadow(0 4px 18px rgba(0,0,0,.28))}
.lbox{position:absolute;left:0;right:0;bottom:0;padding:0 24px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.lsw{display:flex;align-self:center;background:rgba(10,24,18,.85);border-radius:28px;padding:4px;border:1px solid var(--line);margin-bottom:6px}
.lsw button{padding:11px 30px;border-radius:24px;font-weight:700;font-size:16px;color:#fff}.lsw button.on{background:var(--green);color:#04170d}
.cta{height:54px;border-radius:27px;background:linear-gradient(#2fd86d,#14883f);color:#fff;font-size:19px;font-weight:800;box-shadow:0 8px 22px rgba(34,197,94,.35),inset 0 1px 0 rgba(255,255,255,.35);width:100%}
.cta.gh{background:rgba(3,18,11,.7);border:1.5px solid var(--green);color:var(--green);box-shadow:none}
.or{text-align:center;color:var(--mute);font-size:14px;margin:2px 0}
.soc{display:flex;justify-content:center;gap:20px}.soc button{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#fff}.soc .ap{background:#0d1d17;border:1px solid var(--line);color:#fff}.soc .ph{background:#0f4a30;color:#fff;border:1px solid var(--green)}.soc svg{width:26px;height:26px}
.skip{align-self:center;color:var(--mute);font-size:13px;margin-top:2px}
.sheet{position:absolute;inset:0;background:var(--bg0)}
.pc{position:absolute;inset:0;overflow:hidden}.pc .bgph{filter:blur(0)}
.vsh{position:absolute;inset:0;background:linear-gradient(#0000 30%,#000a)}
.sr{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px}
.pill{flex:1;height:46px;border-radius:24px;border:1.5px solid rgba(242,162,28,.7);background:#0007;display:flex;align-items:center;gap:8px;padding:0 14px;color:#fff;backdrop-filter:blur(8px)}
.pill input{flex:1;min-width:0;font-size:15px}.pill input::placeholder{color:#fffa}
.glass{width:46px;height:46px;border-radius:50%;background:#0007;border:1px solid #fff3;display:grid;place-items:center;color:#fff;flex:none}
.glass.rd{background:#e11d48;border:0}
.over{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column}
.over .hdr{color:#fff}.over .ib{color:#fff}
.stage{position:relative;flex:none;height:46%;overflow:hidden}
.stage svg{width:100%;height:100%;display:block}
.cm{flex:1;min-height:0;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:8px;justify-content:flex-start;scrollbar-width:none;background:linear-gradient(#031510,#06251c)}.cm::-webkit-scrollbar{display:none}
.cm .c{display:flex;align-items:center;gap:9px;font-size:14px;text-align:left}.cm .c b{display:block;font-size:12.5px;color:#9be6bd}.cm .c span{unicode-bidi:plaintext;display:block}
.hrt{position:absolute;right:16px;bottom:78px;pointer-events:none;color:#ff3b5c;animation:fl 1.8s ease-out forwards;z-index:5}
@keyframes fl{to{transform:translateY(-190px) scale(1.5);opacity:0}}
.call .bgph{filter:blur(16px) brightness(.62);transform:scale(1.15)}
.call .mid{position:absolute;left:0;right:0;top:20%;display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff}
.call .mid .big{padding:4px;border-radius:50%;background:conic-gradient(#ffd56b,#f2891c,#ffd56b);box-shadow:0 0 30px rgba(242,162,28,.5)}
.call .mid h2{margin:6px 0 0;font-size:30px}.call .mid p{margin:0;font-size:19px;letter-spacing:.06em}
.cbtns{position:absolute;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:36px}
.cbtns .r{display:flex;gap:26px}.cbtns .r button{width:68px;height:68px;border-radius:50%;background:#0008;border:1px solid #fff3;display:grid;place-items:center;color:#fff}.cbtns .r button.on{background:#fff;color:#111}.cbtns .r .ic{width:28px;height:28px}
.cbtns .end{width:78px;height:78px;border-radius:50%;background:#ef3b3b;display:grid;place-items:center;color:#fff;box-shadow:0 8px 26px #ef3b3b80}.end .ic{width:34px;height:34px;transform:rotate(135deg)}
.prof .bgph{height:44%;bottom:auto;background-position:50% 30%}
.prof .bgph::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 40%,var(--bg0))}
.pavs{display:flex;flex-direction:column;align-items:center;margin-top:6px;position:relative;z-index:2}
.pavs .big{padding:4px;border-radius:50%;background:conic-gradient(#ffd56b,#f2891c,#ffd56b);box-shadow:0 0 24px rgba(242,162,28,.5)}
.pavs h2{margin:10px 0 0;font-size:26px}
.list{margin:14px 16px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative;z-index:2}
.li{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;border-bottom:1px solid var(--line);font-size:16px;font-weight:500;text-align:left}.li:last-child{border:0}
.li .ic{color:var(--mute)}.li .t{flex:1}.li .v{color:var(--mute);font-size:14px}.li .ch{width:18px;height:18px;color:var(--mute)}
.li.out{color:var(--red)}.li.out .ic{color:var(--red)}
.fld{margin:0 16px 12px;display:block}
.fld input,.fld textarea,.modal input,.modal textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15.5px;color:var(--text)}
.fld textarea,.modal textarea{min-height:80px;resize:none}
.cats{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}.cats button{flex:1;min-width:58px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);font-size:12px}.cats button.on{border-color:var(--green);background:var(--panel2)}.cats .ic{width:22px;height:22px}
.rad{display:flex;gap:10px;padding:0 16px 14px}.rad button{flex:1;display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);text-align:left}.rad button.on{border-color:var(--green)}.rad i{width:20px;height:20px;border-radius:50%;border:2px solid var(--mute);flex:none;display:grid;place-items:center}.rad .on i{border-color:var(--green)}.rad .on i::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--green)}.rad b{display:block;font-size:14.5px}.rad small{color:var(--mute);font-size:11.5px}
.cover{position:relative;margin:0 16px 14px;height:150px;border-radius:20px;overflow:hidden}.cover .cm2{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:#0008;display:grid;place-items:center;color:#fff}
.thumbs{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}.thumbs button{flex:none;width:62px;height:62px;border-radius:12px;overflow:hidden;border:2px solid transparent}.thumbs button.on{border-color:var(--green)}.thumbs svg{width:100%;height:100%;display:block}
.tools{display:flex;justify-content:space-around;padding:6px 16px 12px;color:var(--mute)}
.pbtn{margin:0 16px 14px;height:52px;border-radius:26px;background:linear-gradient(#2fd86d,#14883f);color:#fff;font-weight:800;font-size:18px;width:calc(100% - 32px)}
.ov{position:absolute;inset:0;z-index:30;background:#000b;display:grid;place-items:center;padding:20px}
.modal{width:min(100%,400px);border-radius:24px;padding:18px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}

function modalHTML(t){const L={login:T('تسجيل الدخول','Sign in'),signup:T('إنشاء حساب','Create account'),social:T('التسجيل الاجتماعي','Social sign-in'),golive:T('بدء بث مباشر','Start a live stream'),account:T('الحساب','Account'),privacy:T('الخصوصية','Privacy'),notifications:T('الإشعارات','Notifications'),appearance:T('المظهر','Appearance'),language:T('اللغة','Language'),storage:T('البيانات والتخزين','Data & storage'),help:T('المساعدة','Help'),about:T('حول ونسة','About Wansa'),editname:T('تعديل الاسم','Edit name'),saved:T('حفظ الرسائل','Saved messages'),devices:T('الأجهزة المرتبطة','Linked devices'),starred:T('الرسائل المميزة','Starred messages'),payments:T('المدفوعات','Payments'),invite:T('دعوة أصدقاء','Invite friends'),attach:T('إرسال وسائط','Send media')};let b='';
 if(t==='login'||t==='signup')b=`<input placeholder="${T('رقم الهاتف أو البريد الإلكتروني','Phone or email')}" dir="auto"><input type="password" placeholder="${T('كلمة المرور','Password')}"><button class="btn" data-act="start">${T('متابعة في الوضع التجريبي','Continue in demo mode')}</button><p class="notice">${T('إنشاء الحسابات الفعلية يتطلب ربط خدمة تسجيل الدخول.','Real accounts need a sign-in service connected.')}</p>`;
 else if(t==='editname')b=`<input id="nn" value="${esc(state.name)}" dir="auto"><button class="btn" data-act="savename">${T('حفظ','Save')}</button>`;
 else if(t==='appearance')b=`<button class="btn ${state.light?'o':''}" data-act="theme" data-v="0">${T('الوضع الداكن','Dark mode')}</button><button class="btn ${state.light?'':'o'}" data-act="theme" data-v="1">${T('الوضع الفاتح','Light mode')}</button><p class="notice">${T('الخلفية الأساسية: الغروب والنخيل','Main background: sunset and palms')}</p>`;
 else if(t==='language')b=`<button class="btn ${state.lang==='ar'?'':'o'}" data-act="lang" data-v="ar">العربية</button><button class="btn ${state.lang==='en'?'':'o'}" data-act="lang" data-v="en">English</button>`;
 else if(t==='attach')b=`<button class="btn" data-act="sendimg">${T('إرسال صورة','Send a photo')}</button><button class="btn o" data-act="sendloc">${T('إرسال موقعي','Send my location')}</button><button class="btn o" data-act="soon">${T('إرسال ملف','Send a file')}</button>`;
 else if(t==='invite')b=`<input readonly value="wansa.app/join/omar" dir="ltr"><button class="btn" data-act="copy">${T('نسخ الرابط','Copy link')}</button>`;
 else b=`<p class="notice">${T({golive:'البث الحقيقي يحتاج خادم بث وصلاحية الكاميرا.',social:'التسجيل الاجتماعي يحتاج ربط حسابات Google وApple.',payments:'المدفوعات تحتاج ربط بوابة دفع.',devices:'ربط الأجهزة يحتاج حساباً فعلياً.'}[t]||'هذه الواجهة تجريبية، وستُربط بالخدمات الفعلية في مرحلة التطوير.',{golive:'Real streaming needs a streaming server and camera access.',social:'Social sign-in needs Google and Apple accounts connected.',payments:'Payments need a payment gateway.',devices:'Linking devices needs a real account.'}[t]||'This is a demo screen and will connect to real services during development.')}</p>`;

function stkCut(ctx,N,tol,box){const d=ctx.getImageData(0,0,N,N),px=d.data,seen=new Uint8Array(N*N),st=[];

 const lim=tol*tol*3;
 for(const [sx,sy] of seeds){const si=(sy*N+sx)*4;const r0=px[si],g0=px[si+1],b0=px[si+2];if(px[si+3]<10)continue;st.push(sy*N+sx);
  while(st.length){const p=st.pop();if(seen[p])continue;const i=p*4;if(px[i+3]<10){seen[p]=1;continue}const dr=px[i]-r0,dg=px[i+1]-g0,db=px[i+2]-b0;if(dr*dr+dg*dg+db*db>lim)continue;seen[p]=1;px[i+3]=0;const x=p%N,y=p/N|0;if(x>0)st.push(p-1);if(x<N-1)st.push(p+1);if(y>0)st.push(p-N);if(y<N-1)st.push(p+N)}}
 // soften the edge: fade pixels adjacent to removed area
 for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){const p=y*N+x;if(!seen[p]&&(seen[p-1]||seen[p+1]||seen[p-N]||seen[p+N])){px[p*4+3]=Math.min(px[p*4+3],170)}}

function gApply(G,pi){const s=G.turn,r=G.roll,p=G.pieces[s][pi],np=p<0?0:p+r;let cap=0;

 if(np<=50){const ab=(LSTART[s]+np)%52;if(!LSAFE.includes(ab)){for(let o=0;o<4;o++){if(o===s)continue;G.pieces[o].forEach((q,qi)=>{if(q>=0&&q<=50&&(LSTART[o]+q)%52===ab){G.pieces[o][qi]=-1;cap++;G.last.cap.push([o,qi])}})}}}
 const fin=np===56;
 if(G.pieces[s].filter(x=>x===56).length>=(G.mode==='quick'?2:4)){G.win=s;G.phase='over';return {cap,fin,win:1}}
 if(r===6||cap||fin){G.phase='roll';G.roll=0}else gNext(G);

function botPick(G,mv){const s=G.turn,r=G.roll;let best=mv[0],bs=-1e9;

  if(p<0)sc+=50;if(np===56)sc+=80;if(np>50&&p<=50)sc+=40;
  if(np<=50){const ab=(LSTART[s]+np)%52;if(LSAFE.includes(ab))sc+=25;
   for(let o=0;o<4;o++){if(o===s)continue;G.pieces[o].forEach(q=>{if(q>=0&&q<=50&&(LSTART[o]+q)%52===ab&&!LSAFE.includes(ab))sc+=100;

    if(q>=0&&q<=50){const d=((ab-(LSTART[o]+q))%52+52)%52;if(d>=1&&d<=6&&!LSAFE.includes(ab))sc-=14}})}}
  if(p>=0&&p<=50){const ab=(LSTART[s]+p)%52;for(let o=0;o<4;o++){if(o===s)continue;G.pieces[o].forEach(q=>{if(q>=0&&q<=50){const d=((ab-(LSTART[o]+q))%52+52)%52;if(d>=1&&d<=6&&!LSAFE.includes(ab))sc+=18}})}}
  if(sc>bs){bs=sc;best=i}}
 return best}

function jCalc(q){const m=q.replace(/[×x✕]/gi,'*').replace(/÷/g,'/').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).match(/[\d.()+\-*/%\s^]{3,}/);if(!m)return null;const e=m[0].replace(/\^/g,'**').trim();if(!/\d/.test(e)||!/[+\-*/%]/.test(e))return null;try{const v=Function('"use strict";return ('+e+')')();if(typeof v==='number'&&isFinite(v))return `${e.replace(/\*\*/g,'^')} = ${+v.toFixed(8)}`}catch(x){}return null}

 const c=jCalc(s);if(c)return c;
 if(s==='dice'||/نرد|dice/.test(l)){const v=1+Math.random()*6|0;return '🎲 '+v}

 if(/^(مرحبا|اهلا|أهلا|هلا|السلام|hi|hello|hey)/.test(l))return T('أهلاً بك! كيف أساعدك؟ 😊','Hello! How can I help? 😊');
 if(/شكرا|شكراً|thank/.test(l))return T('العفو! 🌟','You\'re welcome! 🌟');
 if(/من انت|مين انت|who are you|اسمك/.test(l))return T('أنا جوطه، مساعد ونسة الذكي ✨','I\'m Jota, WANSA\'s smart assistant ✨');
 return null}

const jB64=(blobOrCanvas,type='image/jpeg',q=.82)=>new Promise(res=>{if(blobOrCanvas.toDataURL)return res(blobOrCanvas.toDataURL(type,q).split(',')[1]);const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.readAsDataURL(blobOrCanvas)});
function jFit(src,w,h,max){const sc=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c}
function jLoadImg(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{res(im);setTimeout(()=>URL.revokeObjectURL(u),3000)};im.onerror=()=>rej(new Error('img'));im.src=u})}
function jFrames(f,n=6){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=u;const out=[];let dur=0;
 const fail=()=>{URL.revokeObjectURL(u);rej(new Error('video'))};v.onerror=fail;
 v.onloadedmetadata=()=>{dur=v.duration;if(!isFinite(dur)||dur<=0){dur=1}let i=0;const next=()=>{if(i>=n){URL.revokeObjectURL(u);return res({frames:out,dur})}v.currentTime=Math.min(dur-.05,Math.max(0,(i+.5)*dur/n))};
  v.onseeked=()=>{try{out.push(jFit(v,v.videoWidth||640,v.videoHeight||360,768))}catch(e){return fail()}i++;next()};next()}})}
async function jAddFile(f){const nm=f.name||'file',ty=f.type||'';
 try{
  if(ty.startsWith('image/')){const im=await jLoadImg(f),c=jFit(im,im.naturalWidth,im.naturalHeight,1280),th=jFit(im,im.naturalWidth,im.naturalHeight,96).toDataURL('image/jpeg',.7);state.jAtt.push({kind:'image',name:nm,th,payload:[{type:'image',media_type:'image/jpeg',data:await jB64(c)}]})}
  else if(ty.startsWith('video/')){toast(T('جاري تجهيز الفيديو...','Preparing video...'));const {frames,dur}=await jFrames(f);const pl=[{type:'note',text:`The next ${frames.length} images are still frames sampled evenly across a ${dur.toFixed(1)}s video named "${nm}" (in order).`}];for(const c of frames)pl.push({type:'image',media_type:'image/jpeg',data:await jB64(c,'image/jpeg',.78)});state.jAtt.push({kind:'video',name:nm,th:frames[0].toDataURL('image/jpeg',.5),payload:pl})}
  else if(ty==='application/pdf'||/\.pdf$/i.test(nm)){if(f.size>12*1048576)return toast(T('الملف كبير (أقصى 12MB)','File too large (max 12MB)'));state.jAtt.push({kind:'pdf',name:nm,payload:[{type:'pdf',data:await jB64(f)}]})}
  else if(ty.startsWith('text/')||/\.(txt|md|csv|json|xml|html|css|js|ts|py|java|c|cpp|cs|go|rs|sql|log|yml|yaml|ini|tsv)$/i.test(nm)){if(f.size>1048576)return toast(T('الملف النصي كبير (أقصى 1MB)','Text file too large (max 1MB)'));state.jAtt.push({kind:'text',name:nm,payload:[{type:'text',name:nm,text:await f.text()}]})}
  else return toast(T('نوع الملف غير مدعوم (صور، فيديو، PDF، ملفات نصية)','Unsupported file (images, video, PDF, text files)'))
 }catch(e){toast(T('تعذّر قراءة الملف','Could not read file'))}}

function jStopRec(){const r=JV.rec;JV.rec=null;if(r){r.onend=null;r.onresult=null;r.onerror=null;try{r.abort()}catch(e){}}}
function jStartRec(mode){const SR=jSR();if(!SR){toast(T('متصفحك لا يدعم التعرّف على الصوت (استخدم Chrome أو Edge أو متصفح أندرويد)','Speech recognition not supported in this browser (use Chrome/Edge/Android)'));return false}

 r.onresult=e=>{let fin='',itm='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];(x.isFinal?(fin+=x[0].transcript):(itm+=x[0].transcript))}
  if(mode==='ptt'){const inp=$('#jIn');if(inp&&itm)inp.value=itm;if(fin){JV.ptt=0;jStopRec();const inp2=$('#jIn');if(inp2)inp2.value='';jAsk(fin.trim(),null,1)}}

function jHeard(txt){const n=jNorm(txt),m=n.match(JWAKE);
 if(JV.armed&&Date.now()<JV.armed&&!m){JV.armed=0;jStat();return jAsk(txt,null,1)}
 if(!m)return;const q=txt.slice(0).replace(new RegExp('^.*?'+m[1].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),'').replace(/^[\s,،.!؟?:-]+/,'').trim();
 if(q.length>1)jAsk(q,null,1);else{JV.armed=Date.now()+8000;jStat();try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}setTimeout(jStat,8100)}}
let jAudio=null;const jPrevCache={};
async function jTts(text,voice){const api=lsg(JAPI),tok=lsg(JTOK);const r=await fetch(api,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},tok?{Authorization:'Bearer '+tok}:{}),body:JSON.stringify({op:'tts',text,voice})});if(!r.ok)throw new Error('tts '+r.status);return await r.blob()}

async function jSayNat(t,voice,cacheKey){try{jStopAudio();let blob=cacheKey&&jPrevCache[cacheKey];if(!blob){blob=await jTts(String(t).replace(/[*_`#>]/g,'').slice(0,1200),voice);if(cacheKey)jPrevCache[cacheKey]=blob}
 const a=new Audio(URL.createObjectURL(blob));jAudio=a;JV.busy=1;if(JV.hands)jStopRec();const end=()=>{JV.busy=0;if(JV.hands&&state.screen==='jota'&&!JV.rec)setTimeout(()=>jStartRec('hands'),200)};a.onended=end;a.onerror=end;await a.play();return true}catch(e){JV.busy=0;return false}}

function jSayDev(t){if(!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/[*_`#>]/g,'').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'')),L=jLang();u.lang=L;const P=jVP(),vs=jVoices();let v=vs.find(x=>x.name===P.name)||vs.find(x=>jGender(x)===P.g)||vs[0];if(v)u.voice=v;const g=v?jGender(v):'?';u.pitch=g===P.g?1:(P.g==='m'?.7:1.25);u.rate=P.g==='m'?.95:1;JV.busy=1;if(JV.hands)jStopRec();u.onend=u.onerror=()=>{JV.busy=0;if(JV.hands&&state.screen==='jota'&&!JV.rec)setTimeout(()=>jStartRec('hands'),200)};speechSynthesis.speak(u)}catch(e){JV.busy=0}}

 jsend(){const i=$('#jIn');const v=i?i.value.trim():'';if(!v&&!state.jAtt.length)return;if(i)i.value='';jAsk(v||T('حلّل هذا','Analyze this'))},
 jclr(){const c=state.jconvs.find(x=>x.id===state.jcur);if(c)state.jconvs=state.jconvs.filter(x=>x!==c);state.jcur=null;state.jota=[];state.jdr=0;jcSave();render()},
 jset(){state.jset=1;state.jdr=0;render()},jsetx(){state.jset=0;render()},

 async jtest(){const v=($('#jApi')||{}).value.trim(),t=($('#jTok')||{}).value.trim();if(!v)return toast(T('ضع الرابط أولاً','Enter the URL first'));toast(T('جاري الاختبار...','Testing...'));try{const r=await fetch(v,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},t?{Authorization:'Bearer '+t}:{}),body:JSON.stringify({messages:[{role:'user',content:'Say OK'}]})});const j=await r.json();toast(r.ok?'✅ '+String(j.reply).slice(0,60):'⚠️ '+r.status+' '+String(j.reply||'').slice(0,50))}catch(e){toast(T('❌ لا يمكن الوصول للخادم','❌ Cannot reach the server'))}},
 jattach(){pick('image/*,video/*,application/pdf,text/*,.txt,.md,.csv,.json,.py,.js,.html,.log',{multiple:true},async fs=>{for(const f of fs.slice(0,6))await jAddFile(f);render()})},
 jatx(t){state.jAtt.splice(+t.dataset.i,1);render()},
 jspk(){state.jSpeak=state.jSpeak?0:1;if(!state.jSpeak&&window.speechSynthesis)speechSynthesis.cancel();render()},
 jmic(){if(JV.ptt){JV.ptt=0;jStopRec();return render()}if(JV.hands){toast(T('أوقف وضع 👂 أولاً','Turn off 👂 first'));return}if(jStartRec('ptt')){JV.ptt=1;render()}},
 jhands(){if(JV.hands){JV.hands=0;jStopRec();if(window.speechSynthesis)speechSynthesis.cancel();return render()}if(jStartRec('hands')){JV.hands=1;JV.ptt=0;toast(T('قُل «جوطه» ثم سؤالك','Say "Jota" then your question'));render()}}});
const _aJ=after;after=function(sc){_aJ(sc);if(sc==='jota'){jScroll();const i=$('#jIn');if(i)i.addEventListener('keydown',e=>{if(e.key==='Enter')ACT.jsend()})}else if(JV.hands||JV.ptt||JV.rec||jAudio){jStopAudio();JV.hands=0;JV.ptt=0;jStopRec();try{speechSynthesis.cancel()}catch(e){}}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&JV.hands){JV.hands=0;jStopRec();if(state.screen==='jota')render()}});

try{speechSynthesis.onvoiceschanged=()=>{if(state.screen==='jota'&&state.jset)render()}}catch(e){}
