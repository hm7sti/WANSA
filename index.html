const STORE='wansa-v2-';const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(STORE+k))??d}catch{return d}},put=(k,v)=>localStorage.setItem(STORE+k,JSON.stringify(v));let lang=get('lang','ar'),dark=get('dark',false),page='chats',active=null,search='',wall=get('wall',true),contacts=get('contacts',[{id:'2001',name:'أحمد'},{id:'2002',name:'سارة'},{id:'2003',name:'محمد'}]),messages=get('messages',{}),stories=get('stories',[]),recording=null,recParts=[],recordType='chat';document.body.classList.toggle('dark',dark);const t=(ar,en)=>lang==='ar'?ar:en;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toggleLanguage(){lang=lang==='ar'?'en':'ar';put('lang',lang);render()}function toggleDark(){dark=!dark;put('dark',dark);document.body.classList.toggle('dark',dark);render()}function go(p){page=p;active=null;render()}function render(){document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('lang').textContent=lang==='ar'?'English':'العربية';document.getElementById('mode').textContent=dark?'☀':'☾';const labels=[['chats','💬',t('الدردشات','Chats')],['calls','☎',t('المكالمات','Calls')],['stories','◉',t('الحالة','Stories')],['contacts','♙',t('الأصدقاء','Friends')],['settings','⚙',t('الإعدادات','Settings')]];document.getElementById('nav').innerHTML=labels.map(([id,icon,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${icon}</span>${label}</button>`).join('');let s='';if(page==='chats'){s=`<div class="toolbar"><input placeholder="${t('بحث في الدردشات','Search chats')}" oninput="search=this.value;renderList()" value="${esc(search)}"><button class="primary" onclick="go('contacts')">＋</button></div><div id="list"></div>`}if(page==='chat'){let c=contacts.find(x=>x.id===active);if(!c){go('chats');return}s=`<div class="chathead"><button class="secondary" onclick="go('chats')">❮</button><div class="avatar">${esc(c.name[0])}</div><div style="flex:1"><b>${esc(c.name)}</b><div class="muted">ID ${esc(c.id)}</div></div><button class="secondary" onclick="callUser('audio')">☎</button><button class="secondary" onclick="callUser('video')">▣</button></div><div class="messages ${wall?'wallpaper':''}" id="msgs">${(messages[active]||[]).map(m=>`<div class="bubble mine">${msgHTML(m)}</div>`).join('')}</div><div class="compose"><button class="secondary" onclick="document.getElementById('file').click()">📎</button><button class="secondary" onclick="document.getElementById('camera').click()">📷</button><input class="field" id="message" placeholder="${t('اكتب رسالة','Write a message')}" onkeydown="if(event.key==='Enter')sendText()"><button class="secondary" onclick="voice('chat')">🎙</button><button class="primary" onclick="sendText()">➤</button></div>`}if(page==='contacts')s=`<section class="section"><h2>${t('إضافة حساب بواسطة WANSA ID','Add by WANSA ID')}</h2><div class="row"><input class="field" id="cid" inputmode="numeric" placeholder="2004"><input class="field" id="cname" placeholder="${t('الاسم','Name')}"></div><p><button class="primary" onclick="addContact()">＋ ${t('إضافة','Add')}</button></p><p class="note">${t('الإضافة هنا تجريبية على جهازك. الحسابات الحقيقية تحتاج سيرفر.','Contacts here are local demos. Real accounts require a server.')}</p><h2>${t('جهات الاتصال','Contacts')}</h2>${contacts.map(c=>`<div class="item"><div class="avatar">${esc(c.name[0])}</div><div class="grow"><b>${esc(c.name)}</b><div class="muted">ID ${esc(c.id)}</div></div><button class="secondary" onclick="openChat('${esc(c.id)}')">💬</button><button class="secondary" onclick="callUser('audio','${esc(c.id)}')">☎</button><button class="secondary" onclick="saveVCard('${esc(c.id)}')">⇩</button></div>`).join('')}</section>`;if(page==='calls')s=`<section class="section"><h2>${t('المكالمات','Calls')}</h2><div class="notice">${t('المكالمات حالياً محاكاة للواجهة فقط؛ لا تتصل بأشخاص حقيقيين.','Calls are UI simulations only; they do not connect to real people.')}</div>${contacts.map(c=>`<div class="item"><div class="avatar">${esc(c.name[0])}</div><div class="grow">${esc(c.name)}</div><button class="secondary" onclick="callUser('audio','${esc(c.id)}')">☎</button><button class="secondary" onclick="callUser('video','${esc(c.id)}')">▣</button></div>`).join('')}</section>`;if(page==='call')s=`<section class="section" style="text-align:center;padding-top:70px"><div class="avatar" style="margin:auto;width:90px;height:90px;font-size:45px">☎</div><h2>${esc(active||'WANSA')}</h2><p>${t('تجربة واجهة المكالمة فقط','Call screen demo only')}</p><p class="note">${t('مافي اتصال حقيقي حالياً','No live connection')}</p><button class="primary" style="background:#bd3535" onclick="go('calls')">${t('إنهاء','End call')}</button></section>`;if(page==='stories')s=`<section class="section"><h2>${t('الاستوريهات','Stories')}</h2><div class="row"><button class="primary" onclick="newStory('text')">✎ ${t('كتابة','Text')}</button><button class="secondary" onclick="newStory('media')">▣ ${t('صورة/فيديو','Photo/Video')}</button><button class="secondary" onclick="voice('story')">🎙 ${t('صوت','Voice')}</button></div><p class="note">${t('الاستوريهات التجريبية محفوظة على جهازك فقط.','Demo stories stay on this device only.')}</p>${stories.map((x,i)=>`<div class="card"><div class="row between"><b>${t('حالتي','My story')}</b><button class="secondary" onclick="stories.splice(${i},1);put('stories',stories);render()">✕</button></div><div class="story">${msgHTML(x)}</div></div>`).join('')}</section>`;if(page==='settings')s=`<section class="section"><div class="card"><h2>${t('حسابي','My account')}</h2><div class="row"><div class="avatar">و</div><div><b>WANSA</b><div>ID: <b>56</b> 👑</div></div><button class="secondary" onclick="navigator.clipboard?.writeText('56');alert('56')">${t('نسخ','Copy')}</button></div><p class="note">${t('هذا حساب تجريبي محلي، وليس هوية محجوزة على خادم بعد.','This is a local demo account, not yet a server-reserved identity.')}</p></div><div class="card"><h2>${t('المظهر','Appearance')}</h2><label class="switch">${t('الوضع الداكن','Dark mode')} <input type="checkbox" ${dark?'checked':''} onchange="toggleDark()"></label><label class="switch">${t('خلفية وِنسة الافتراضية','Default WANSA chat wallpaper')} <input type="checkbox" ${wall?'checked':''} onchange="wall=this.checked;put('wall',wall)"></label><label class="switch">${t('اللغة','Language')} <button class="secondary" onclick="toggleLanguage()">${lang==='ar'?'العربية':'English'}</button></label></div><div class="card"><h2>${t('الإشعارات والصلاحيات','Notifications & permissions')}</h2><button class="primary" onclick="enableNotifications()">🔔 ${t('تفعيل الإشعارات','Enable notifications')}</button><p class="note" id="notifyStatus">${t('إشعارات المتصفح المحلي فقط. إشعارات الرسائل من الآخرين تحتاج خادماً وHTTPS.','Local browser notifications only. Remote message push requires a backend and HTTPS.')}</p><button class="secondary" onclick="document.getElementById('file').click()">${t('اختيار صورة أو فيديو أو ملف','Choose photo/video/file')}</button> <button class="secondary" onclick="document.getElementById('camera').click()">📷 ${t('الكاميرا','Camera')}</button><p class="note">${t('صلاحية الصور والكاميرا تُطلب عند الاستخدام حسب المتصفح.','Media and camera access is requested by the browser when used.')}</p></div></section>`;document.getElementById('screen').innerHTML=s;if(page==='chats')renderList();if(page==='chat')document.getElementById('msgs').scrollTop=999999}function renderList(){let e=document.getElementById('list');if(!e)return;e.innerHTML=contacts.filter(c=>c.name.includes(search)||c.id.includes(search)).map(c=>`<div class="item" onclick="openChat('${esc(c.id)}')"><div class="avatar">${esc(c.name[0])}</div><div class="grow"><b>${esc(c.name)}</b><div class="muted">${esc((messages[c.id]||[]).slice(-1)[0]?.text||'WANSA ID: '+c.id)}</div></div><span>❯</span></div>`).join('')}function openChat(id){active=id;page='chat';render()}function addContact(){let id=document.getElementById('cid').value.trim(),name=document.getElementById('cname').value.trim();if(!/^\d+$/.test(id)||!name)return alert(t('اكتب ID رقمي واسم','Enter numeric ID and name'));if(contacts.some(x=>x.id===id))return alert(t('الحساب موجود','Already exists'));contacts.push({id,name});put('contacts',contacts);render()}function sendText(){let e=document.getElementById('message'),v=e.value.trim();if(!v)return;(messages[active]??=[]).push({type:'text',text:v});put('messages',messages);render()}function msgHTML(m){if(m.type==='text')return esc(m.text);if(m.type==='audio')return `<audio controls src="${m.data}"></audio>`;if(m.type==='image')return `<img class="media" src="${m.data}" alt="photo">`;if(m.type==='video')return `<video class="media" controls src="${m.data}"></video>`;return `<div>📄 ${esc(m.name||'File')} <span class="muted">${t('تجريبي','Demo')}</span></div>`}function sendFile(e){let f=e.target.files[0];if(!f)return;if(f.size>3e6){alert(t('للنسخة التجريبية: الحد 3 ميجابايت للملف','Demo limit: 3 MB per file'));return}let r=new FileReader();r.onload=()=>{let type=f.type.startsWith('image/')?'image':f.type.startsWith('video/')?'video':'file';let m={type,data:r.result,name:f.name};if(page==='stories'){stories.unshift(m);try{put('stories',stories)}catch{alert(t('مساحة التخزين ممتلئة','Storage full'))}}else if(active){(messages[active]??=[]).push(m);try{put('messages',messages)}catch{alert(t('مساحة التخزين ممتلئة','Storage full'))}}else{alert(t('افتح محادثة أو استوري أولاً','Open a chat or story first'))}render()};r.readAsDataURL(f);e.target.value=''}function newStory(type){if(type==='media'){page='stories';document.getElementById('file').click();return}let v=prompt(t('اكتب الاستوري','Write story'));if(v?.trim()){stories.unshift({type:'text',text:v});put('stories',stories);render()}}async function voice(target){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){alert(t('التسجيل الصوتي يحتاج HTTPS أو localhost ومتصفح يدعمه','Recording needs HTTPS or localhost and supported browser'));return}if(recording){recording.stop();return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});recordType=target;recParts=[];recording=new MediaRecorder(stream);recording.ondataavailable=e=>recParts.push(e.data);recording.onstop=()=>{let blob=new Blob(recParts,{type:recording.mimeType}),r=new FileReader();r.onload=()=>{let m={type:'audio',data:r.result};if(recordType==='story'){stories.unshift(m);try{put('stories',stories)}catch{}}else if(active){(messages[active]??=[]).push(m);try{put('messages',messages)}catch{}}recording=null;render()};r.readAsDataURL(blob);stream.getTracks().forEach(x=>x.stop())};recording.start();alert(t('بدأ التسجيل. اضغط زر الميكروفون مرة ثانية للإيقاف.','Recording started. Tap microphone again to stop.'))}catch(e){alert(t('تعذر تشغيل الميكروفون: ','Microphone unavailable: ')+e.message)}}function callUser(type,id){active=id||active||'2001';page='call';render()}function saveVCard(id){let c=contacts.find(x=>x.id===id),content=`BEGIN:VCARD\nVERSION:3.0\nFN:${c.name}\nNOTE:WANSA ID ${c.id}\nEND:VCARD`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/vcard'}));a.download='WANSA-'+c.id+'.vcf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function enableNotifications(){if(!('Notification'in window))return alert(t('المتصفح لا يدعم الإشعارات','Browser does not support notifications'));try{let p=await Notification.requestPermission();if(p==='granted'){new Notification('ونسة',{body:t('الإشعارات المحلية مفعّلة','Local notifications enabled')});alert(t('تم تفعيل إشعارات المتصفح المحلية','Local browser notifications enabled'))}else alert(t('الإذن غير متاح: ','Permission: ')+p)}catch(e){alert(t('افتح الموقع عبر HTTPS لتفعيل الإشعارات.','Use HTTPS to enable notifications.'))}}render();
