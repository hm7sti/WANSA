function sendMsg(){let el=$('message'),v=el.value.trim();if(!v)return;let id=contacts[chat].id;chats[id]=chats[id]||[];chats[id].push({text:v,me:true});store('chats',chats);render()}function demoCall(type){toast('مكالمات '+type+' غير مفعّلة في النسخة التجريبية. تحتاج خادم WebRTC واتصال مستخدمين حقيقي.')}
function editBio(){let b=prompt('اكتب البايو',bio);if(b!==null){bio=b.slice(0,160);store('bio',bio);render()}}function copyId(){navigator.clipboard?.writeText('56').then(()=>toast('تم نسخ 56')).catch(()=>toast('WANSA ID: 56'))}function addContact(){let id=prompt('أدخل WANSA ID (2001 وما فوق)');if(!id)return;if(!/^\d+$/.test(id)||Number(id)<2001)return toast('أدخل ID صحيح يبدأ من 2001');if(contacts.some(c=>c.id===Number(id)))return toast('موجود بالفعل');let name=prompt('اسم جهة الاتصال')||'مستخدم '+id;contacts.push({id:Number(id),name,initial:name[0],online:false});store('contacts',contacts);render()}
async function phoneContacts(){try{if(navigator.contacts?.select){let cs=await navigator.contacts.select(['name','tel'],{multiple:false});if(cs.length){let name=cs[0].name?.[0]||'جهة اتصال';toast('تم اختيار '+name+'، إضافة WANSA ID تتم بشكل منفصل')}}else toast('اختيار جهات الاتصال غير مدعوم في المتصفح ده')}catch(e){toast('لم يتم اختيار جهة اتصال')}}
let uploadFor='chat';function pick(which){uploadFor=which;$('upload').click()}function onUpload(el){let f=el.files?.[0];if(!f)return;if(f.size>5*1024*1024){toast('للنسخة التجريبية اختار ملف أقل من 5MB');return}let r=new FileReader();r.onload=()=>{if(uploadFor==='story'){stories.unshift({type:f.type.startsWith('image')?'image':'file',content:f.type.startsWith('image')?r.result:f.name,date:new Date().toLocaleString()});store('stories',stories);go('updates')}else if(uploadFor==='profile'){toast('تم اختيار الصورة محلياً؛ صورة الحساب في الإصدار القادم')}else{let id=contacts[chat].id;chats[id]=chats[id]||[];chats[id].push({text:f.name,media:f.type.startsWith('image')?r.result:null,me:true});try{store('chats',chats)}catch(e){toast('مساحة التخزين المحلية ممتلئة')}go('chat')}};r.readAsDataURL(f);el.value=''}function addStory(){let v=$('storytext').value.trim();if(!v)return;stories.unshift({type:'text',content:v,date:new Date().toLocaleString()});store('stories',stories);go('updates')}
async function voiceMsg(){await recordVoice('chat')}async function voiceStory(){await recordVoice('story')}async function recordVoice(which){if(recording){rec.stop();return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});let chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());recording=false;let blob=new Blob(chunks,{type:rec.mimeType});let url=URL.createObjectURL(blob);if(which==='story'){stories.unshift({type:'audio',content:'🎙 تسجيل صوتي تجريبي',date:new Date().toLocaleString()});store('stories',stories);go('updates')}else{let id=contacts[chat].id;chats[id]=chats[id]||[];chats[id].push({text:'🎙 تسجيل صوتي محلي (غير مرسل)',me:true});store('chats',chats);render()}let audio=new Audio(url);if(confirm('تم التسجيل. تشغيل التسجيل؟'))audio.play()};rec.start();recording=true;toast('بدأ التسجيل. اضغط زر الميكروفون مرة تانية للإيقاف')}catch(e){toast('الميكروفون غير متاح أو لم تمنح الإذن')}}
async function toggleNotifications(on){notifications=on;store('notifications',on);if(on&&'Notification'in window){let perm=await Notification.requestPermission();if(perm!=='granted'){notifications=false;store('notifications',false)}}render()}function testNotify(){if(Notification.permission==='granted')new Notification('وِنسة 🇸🇩',{body:'إشعار تجريبي من وِنسة'});else toast('فعّل إذن الإشعارات أولاً')}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
